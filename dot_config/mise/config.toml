[tools]
bun = "latest"
deno = "latest"
direnv = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
java = "latest"
lazygit = "latest"
lsd = "latest"
"aqua:neovim/neovim" = "latest"
# OpenCode V2: aqua downloads the release binary, so no pnpm postinstall is needed
"aqua:anomalyco/opencode" = "latest"
node = "latest"
pnpm = "12"
peco = "latest"
pipx = "latest"
python = "latest"
rg = "latest"
rust = "latest"
starship = "latest"
task = "latest"
terraform = "latest"
tmux = "latest"
typos = "latest"
zellij = "latest"
ghq = "latest"
gitleaks = "latest"
zoxide = "latest"
claude = "latest"
"npm:difit" = { version = "latest" }
# Pinned on purpose: upstream source is not public. See docs/ticktick-cli.md before bumping.
"npm:@ticktick/ticktick-cli" = "0.1.15"
pi = "latest"
"npm:@opencode/browse" = "0.0.16"

[settings]
npm.package_manager = "pnpm"
idiomatic_version_file_enable_tools = ["terraform"]
trusted_config_paths = ["~/ghq"]
lockfile_platforms = ["macos-arm64"]

[settings.aqua]
baked_registry = true

[env]
# browse: keep the mise pin authoritative; its self-update would run npm install -g outside mise
OPENCODE_BROWSER_AUTO_UPDATE = "off"
