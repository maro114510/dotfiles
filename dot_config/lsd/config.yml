classic: false
blocks:
  - permission
  - user
  - group
  - size
  - date
  - name
color:
  when: auto
  theme: default
date: date
dereference: false
icons:
  when: auto
  theme: fancy
  separator: " "
indicators: false
layout: grid
recursion:
  enabled: false
size: default
sorting:
  column: name
  reverse: false
  dir-grouping: none
no-symlink: false

# 通常の一覧では配下サイズを計算しない。必要な場合は `lls` を使う。
total-size: false
symlink-arrow: ⇒
