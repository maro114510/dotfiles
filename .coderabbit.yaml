# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # dotfiles-autosync titles every PR "chore(autosync): sync ...". Its changes
    # are machine-generated, so they do not need a review.
    ignore_title_keywords:
      - "chore(autosync): sync"
