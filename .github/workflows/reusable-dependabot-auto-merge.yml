# Auto-merges a Dependabot pull request once every check on it has passed.
#
# This file is called by a small pull_request_target workflow in each repository
# that wants the behavior: a caller declares only the trigger, the permissions,
# and the merge method. The workflow never checks out a pull request, so the
# privileged trigger runs no untrusted code.
#
# The trigger is pull_request_target, not pull_request: a Dependabot pull request
# in a public repository gets a read-only token and no secrets under pull_request,
# so a job on that trigger could neither label nor merge.
name: reusable-dependabot-auto-merge

on:
  workflow_call:
    inputs:
      merge-method:
        description: Merge method for gh pr merge, one of squash, merge, or rebase.
        required: false
        type: string
        default: squash

jobs:
  automerge:
    name: Auto-merge a patch or minor Dependabot update
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Leave anything but a patch or minor update to a person
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        run: echo "::notice::Not a patch or minor update; leaving the pull request open."

      - name: Merge once every check has passed
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$MERGE_METHOD" in
            squash|merge|rebase) ;;
            *) echo "::error::Unsupported merge-method: $MERGE_METHOD"; exit 1 ;;
          esac
          # The update type was checked for EXPECTED_HEAD. Never merge a newer revision
          # with the metadata or the green checks from an older one.
          deadline=$(( SECONDS + 1500 ))
          stable_checks=""
          stable_since=0
          while :; do
            head_before="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
            if [[ "$head_before" != "$EXPECTED_HEAD" ]]; then
              echo "::notice::PR head changed; a synchronize run must re-evaluate the update."
              exit 0
            fi

            # gh returns nonzero for failed/pending checks even when JSON is valid.
            # A genuine API failure must not be interpreted as an empty check list.
            checks="$(gh pr checks "$PR" --repo "$REPO" --json name,bucket 2>/dev/null)" || true
            if ! jq -e 'type == "array" and all(.[]; (.name | type) == "string" and (.bucket | IN("pass", "fail", "pending", "skipping", "cancel")))' <<<"$checks" >/dev/null; then
              echo "::error::Could not read a valid, complete PR check list."
              exit 1
            fi
            # Do not exclude checks by name: another job may use the same display name.
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<<"$checks" >/dev/null; then
              echo "::notice::A check failed or was cancelled; leaving the PR open."
              exit 0
            fi

            if jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null; then
              # Give slow-to-register checks time to appear before accepting the set.
              signature="$(jq -cS 'sort_by(.name, .bucket) | map({name, bucket})' <<<"$checks")"
              if [[ "$signature" != "$stable_checks" ]]; then
                stable_checks="$signature"
                stable_since=$SECONDS
              fi

              if (( SECONDS - stable_since >= 60 )); then
                # Recheck the check set and head after the settling period. A final
                # --match-head-commit also closes the last head-update race.
                final_checks="$(gh pr checks "$PR" --repo "$REPO" --json name,bucket 2>/dev/null)" || true
                if ! jq -e 'type == "array" and all(.[]; (.name | type) == "string" and (.bucket | IN("pass", "fail", "pending", "skipping", "cancel")))' <<<"$final_checks" >/dev/null; then
                  echo "::error::Could not re-read PR checks."
                  exit 1
                fi
                final_signature="$(jq -cS 'sort_by(.name, .bucket) | map({name, bucket})' <<<"$final_checks")"
                if [[ "$final_signature" == "$signature" ]] &&
                  jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<<"$final_checks" >/dev/null; then
                  head_after="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
                  if [[ "$head_after" != "$EXPECTED_HEAD" ]]; then
                    echo "::notice::PR head changed during check polling; leaving it open."
                    exit 0
                  fi
                  if ! gh pr merge "$PR" --repo "$REPO" "--$MERGE_METHOD" --match-head-commit "$EXPECTED_HEAD"; then
                    echo "::notice::Could not merge; leaving the PR to a person."
                  fi
                  exit 0
                fi
                stable_checks=""
              fi
            else
              stable_checks=""
            fi

            if (( SECONDS >= deadline )); then
              echo "::notice::Checks did not settle in time; leaving the PR open."
              exit 0
            fi
            sleep 20
          done