# Auto-merges a Dependabot pull request once every check on it has passed.
#
# This file is called by a small pull_request_target workflow in each repository
# that wants the behavior: a caller declares only the trigger, the permissions,
# and the merge method. The workflow never checks out a pull request, so the
# privileged trigger runs no untrusted code.
#
# For public repositories, pull_request_target requires an applicable Actions
# event policy that allows the event (default policy enforcement: 2026-12-02).
# Dependabot-triggered pull_request also normally has a read-only token.
name: reusable-dependabot-auto-merge

on:
  workflow_call:
    inputs:
      merge-method:
        description: Merge method for gh pr merge, one of squash, merge, or rebase.
        required: false
        type: string
        default: squash
      wait-minutes:
        description: Polling deadline (1 to 25 minutes)
        required: false
        type: number
        default: 20

jobs:
  automerge:
    name: Auto-merge a patch or minor Dependabot update
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Leave anything but a patch or minor update to a person
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        run: echo "::notice::Not a patch or minor update; leaving the pull request open."

      - name: Merge once every check has passed
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$MERGE_METHOD" in
            squash|merge|rebase) ;;
            *) echo "::error::Unsupported merge-method: $MERGE_METHOD"; exit 1 ;;
          esac
          if ! [[ "$WAIT_MINUTES" =~ ^([1-9]|1[0-9]|2[0-5])$ ]]; then
            echo "::error::wait-minutes must be an integer between 1 and 25"
            exit 1
          fi
          deadline=$(( SECONDS + WAIT_MINUTES * 60 ))
          while :; do
            head="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
            if [[ "$head" != "$EXPECTED_HEAD" ]]; then
              echo "::notice::PR head changed; a new run must handle it."
              exit 0
            fi

            # gh pr checks can exit nonzero when checks are pending or failed,
            # even if its stdout contains valid JSON. Do not ignore malformed output.
            raw="$(gh pr checks "$PR" --repo "$REPO" --json name,bucket,link)" || :
            if ! jq -e 'type == "array" and all(.[]; .bucket | type == "string")' <<<"$raw" >/dev/null; then
              echo "::error::Unable to retrieve a valid check list"
              exit 1
            fi

            # Exclude checks belonging to this Actions run only.
            # E2E must confirm the link format for a reusable workflow.
            checks="$(jq -c --arg self "/actions/runs/${GITHUB_RUN_ID}" \
              '[.[] | select((.link // "" | contains($self)) | not)]' <<<"$raw")"
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<<"$checks" >/dev/null; then
              echo "::notice::A check failed or was cancelled; leaving the PR open."
              exit 0
            fi
            if jq -e 'any(.[]; .bucket != "pass" and .bucket != "skipping" and .bucket != "pending")' <<<"$checks" >/dev/null; then
              echo "::error::Unknown check state; refusing to merge."
              exit 1
            fi
            if jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null; then
              head="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
              if [[ "$head" != "$EXPECTED_HEAD" ]]; then
                echo "::notice::PR head changed while evaluating checks."
                exit 0
              fi
              if ! gh pr merge "$PR" --repo "$REPO" "--$MERGE_METHOD" \
                --match-head-commit "$EXPECTED_HEAD"; then
                echo "::warning::Merge was rejected; check permissions and branch rules."
              fi
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::notice::Checks did not finish in time; leaving the PR open."
              exit 0
            fi
            sleep 20
          done
